<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The FAF Trinity — interactive</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg1:#101418; --bg2:#060607;
    --orange:#FF6B35; --cyan:#00D4D4;
    --fmt:#00D4D4;   /* format-token colour (.faf/.fafm/.fafa) — cyan, set apart from the orange geometry */
    --ink:#f4f6f7; --muted:#7a8a95; --dim:#5a6b74;
    --line:#1e262c; --card:#0d1114;
    --mono:"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  }
  html,body { height:100%; }
  body {
    background:radial-gradient(120% 120% at 50% 30%, var(--bg1), var(--bg2));
    color:var(--ink); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  .wrap { display:grid; grid-template-columns:1fr 400px; height:100vh; }
  @media (max-width:880px){ .wrap{ grid-template-columns:1fr; grid-template-rows:1fr auto; } }

  /* ---- left: the stage ---- */
  .stageWrap { position:relative; display:flex; align-items:center; justify-content:center; }
  .brand {
    position:absolute; top:26px; left:32px; font-size:13px; letter-spacing:3px;
    text-transform:uppercase; color:var(--dim);
  }
  .brand b { color:var(--muted); font-weight:700; }
  .pointCap {
    position:absolute; top:26px; left:50%; transform:translateX(-50%);
    font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--orange);
    opacity:.85; white-space:nowrap; transition:color .2s ease;
  }
  .pointCap.fastcap { color:var(--cyan); opacity:1; }
  .controls {
    position:absolute; bottom:24px; left:50%; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:11px; white-space:nowrap;
  }
  .modes { font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--dim); }
  .modes .m { transition:color .2s; }
  .modes .m.on { color:var(--ink); }
  .modes .m[data-m="1"].on { color:var(--cyan); }         /* AI cache speed lights cyan */
  .modes .sep { margin:0 8px; color:var(--line); }
  .spaceKey {
    display:inline-flex; align-items:center; gap:10px; justify-content:center;
    min-width:264px; height:44px; padding:0 22px;
    background:#12181d; color:var(--muted);
    border:1px solid #2a343b; border-bottom:3px solid #2a343b; border-radius:9px;
    font-family:var(--mono); font-size:12px; letter-spacing:4px; text-transform:uppercase;
    cursor:pointer; user-select:none;
    transition:transform .08s ease, border-color .2s, color .2s, background .2s;
    animation:breathe 2.6s ease-in-out infinite;                 /* pulses to invite the press */
  }
  .spaceKey .glyph { font-size:18px; letter-spacing:0; line-height:1; }
  .spaceKey:hover { color:var(--ink); border-color:#3a4650; background:#161d23; }
  .spaceKey.press { transform:translateY(2px); border-bottom-width:1px; }
  .spaceKey.used  { animation:none; }                            /* calm down once they've used it */
  @keyframes breathe {
    0%,100% { box-shadow:0 0 0 0 rgba(0,212,212,0); }
    50%     { box-shadow:0 0 0 5px rgba(0,212,212,.10); }
  }
  .subhint { font-size:12px; color:var(--dim); }
  .subhint kbd {
    font-family:var(--mono); font-size:11px; color:var(--muted);
    border:1px solid var(--line); border-radius:5px; padding:1px 6px; margin:0 2px;
  }

  .stage { position:relative; width:560px; height:560px; }
  @media (max-width:620px){ .stage{ transform:scale(.82); } }

  /* the rotor holds the triangle + nodes and spins; center mark is a sibling that never moves */
  .rotor { position:absolute; inset:0; will-change:transform; }
  .rotor svg { position:absolute; inset:0; overflow:visible; }

  .node {
    position:absolute; transform:translate(-50%,-50%);
    text-align:center; width:180px; cursor:pointer; user-select:none;
    transition:filter .25s ease;
  }
  .node .role { font-size:26px; font-weight:800; color:var(--ink); line-height:1; }
  .node .ext  { font-family:var(--mono); font-size:17px; font-weight:700; color:var(--fmt); margin-top:7px; }
  .node .verb { font-size:14px; color:var(--ink); font-style:italic; margin-top:5px; }
  .node .dot {
    width:14px; height:14px; border-radius:50%; background:var(--orange);
    margin:0 auto 12px; box-shadow:0 0 0 5px rgba(255,107,53,.14);
    transition:box-shadow .25s ease, transform .25s ease;
  }
  .node:hover .dot { box-shadow:0 0 0 8px rgba(255,107,53,.20); transform:scale(1.1); }
  .node.top   .dot { background:var(--cyan); box-shadow:0 0 0 9px rgba(0,212,212,.20); }
  .node.top   .role{ color:#fff; }
  .node.active .dot { background:var(--cyan); box-shadow:0 0 0 10px rgba(0,212,212,.28); transform:scale(1.15); }
  .node.dim   { filter:opacity(.45); }

  .center {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    text-align:center; cursor:pointer; z-index:3;
  }
  .center img { width:104px; height:104px; display:block; margin:0 auto; }
  .center .whole { font-size:22px; font-weight:800; margin-top:8px; letter-spacing:-.4px; }
  .center .found { font-size:13px; font-weight:700; color:var(--orange); margin-top:1px; letter-spacing:.3px; }

  /* ---- right: the panel ---- */
  .panel {
    background:var(--card); border-left:1px solid var(--line);
    padding:40px 34px; display:flex; flex-direction:column; gap:0;
    overflow-y:auto;
  }
  @media (max-width:880px){ .panel{ border-left:none; border-top:1px solid var(--line); max-height:44vh; } }
  .panel .kicker { font-size:12px; letter-spacing:3px; text-transform:uppercase; color:var(--dim); }
  .panel h1 { font-size:34px; font-weight:800; margin-top:10px; line-height:1; }
  .panel .file {
    display:inline-block; font-family:var(--mono); font-size:16px; font-weight:700; color:var(--fmt);
    border:1.5px solid var(--fmt); border-radius:8px; padding:5px 13px; margin-top:16px;
    background:rgba(0,212,212,.06);
  }
  .panel .verbline { font-size:15px; color:var(--muted); font-style:italic; margin-top:14px; }
  .panel .body { font-size:15.5px; line-height:1.6; color:#c4d0d6; margin-top:20px; }
  .panel .body strong { color:var(--ink); font-weight:700; }
  .panel .meta { margin-top:24px; border-top:1px solid var(--line); padding-top:18px; }
  .panel .meta .row { display:flex; gap:10px; font-size:13.5px; padding:5px 0; }
  .panel .meta .row .k { color:var(--dim); min-width:92px; }
  .panel .meta .row .v { color:#c4d0d6; font-family:var(--mono); font-size:12.5px; }
  .panel .meta .row .v.plain { font-family:var(--sans); font-size:13.5px; }
  .panel .swap { animation:fade .32s ease; }
  @keyframes fade { from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:none; } }

  .accent-context .file, .accent-context h1 span { color:var(--orange); }
  .foot { margin-top:auto; padding-top:26px; font-size:12.5px; color:var(--dim); }
  .foot b { color:var(--muted); font-weight:700; }
</style>
</head>

<script>
(function(){
  "use strict";
  var SIZE = 560, R = 205, C = SIZE/2;

  // The three, in clockwise order starting at the top.
  var NODES = [
    { id:"agent",   role:"Agent",   ext:".fafa", verb:"acts",
      kicker:"What does the work",
      body:"The <strong>Agent Card</strong> — what actually does the work. It reads Context to know the project, carries Memory across sessions, and acts. <strong>AGENTS.md</strong> is its first touch point: the file an agent opens the moment it enters your repo.",
      meta:[["role","acts on the project"],["projects to","AGENTS.md","mono"],["reads","Context (.faf)","mono"],["carries","Memory (.fafm)","mono"]] },
    { id:"context", role:"Context", ext:".faf", verb:"knows",
      kicker:"What the project is",
      body:"The <strong>structured source of truth</strong> an AI reads — what the project <em>is</em>. Detected from the repo, scored, and versioned with your code. It never guesses: every field traces to something real.",
      meta:[["role","knows the project"],["media type","application/vnd.faf+yaml","mono"],["registry","IANA-registered","plain"],["projects to","AGENTS.md · CLAUDE.md","mono"]] },
    { id:"memory",  role:"Memory",  ext:".fafm", verb:"remembers",
      kicker:"What the agent learned",
      body:"What the agent has <strong>learned and carries forward</strong> — persistent, multi-profile recall that survives past a single session. Context is what the project is; Memory is what the agent came to know about working in it.",
      meta:[["role","remembers across sessions"],["format",".fafm","mono"],["scope","multi-profile recall","plain"],["pairs with","Context (.faf)","mono"]] }
  ];
  var WHOLE = {
    id:"whole", role:"whole", kicker:"Three points, one",
    body:"<strong>Context</strong> knows. <strong>Memory</strong> remembers. <strong>Agents</strong> act. Three points on one foundation — the whole is what an AI needs to work your project like it already lives there.",
    meta:[["context",".faf — knows","mono"],["memory",".fafm — remembers","mono"],["agent",".fafa — acts","mono"]]
  };

  var rotor = document.getElementById("rotor");
  var poly  = document.getElementById("poly");
  var pointCap = document.getElementById("pointCap");
  var panel = document.getElementById("panel");

  // place vertices: node i at angle -90 + i*120 (deg), 0=top
  var pts = NODES.map(function(_,i){
    var a = (-90 + i*120) * Math.PI/180;
    return { x: C + R*Math.cos(a), y: C + R*Math.sin(a) };
  });
  poly.setAttribute("points", pts.map(function(p){ return p.x.toFixed(1)+","+p.y.toFixed(1); }).join(" "));

  // build node elements
  var els = NODES.map(function(n,i){
    var d = document.createElement("div");
    d.className = "node"; d.style.left = pts[i].x+"px"; d.style.top = pts[i].y+"px";
    d.innerHTML = '<div class="dot"></div><div class="role">'+n.role+'</div>'+
                  '<div class="ext">'+n.ext+'</div><div class="verb">'+n.verb+'</div>';
    d.addEventListener("click", function(e){ e.stopPropagation(); select(i); });
    rotor.appendChild(d);
    return d;
  });
  document.getElementById("center").addEventListener("click", function(){ selectWhole(); });

  // ---- spacebar control graphic ----
  var modesEl = document.getElementById("modes");
  var spaceKey = document.getElementById("spaceKey");
  function paintModes(){
    if(!modesEl) return;
    var chips = modesEl.querySelectorAll(".m");
    for(var i=0;i<chips.length;i++){
      chips[i].classList.toggle("on", parseInt(chips[i].getAttribute("data-m"),10)===mode);
    }
  }
  function pressKey(){
    if(!spaceKey) return;
    spaceKey.classList.add("press","used");
    setTimeout(function(){ spaceKey.classList.remove("press"); }, 130);
  }
  spaceKey.addEventListener("click", function(e){
    e.stopPropagation();
    if(active!=null){ resume(); } else { setMode(mode+1); }
    pressKey();
  });

  // ---- spin state ----
  var theta = 0;           // current rotor angle (deg)
  var target = null;       // animation target (deg) or null while free-spinning
  var spinning = true;     // idle auto-spin
  var fast = false;        // fast spin = AI cache speed
  var mode = 0;            // Space cycles 3 reading modes: 0 human speed · 1 AI cache speed · 2 stop
  var active = null;       // selected node index, or "whole", or null
  var last = null;

  function setMode(m){
    mode = ((m%3)+3)%3;
    if(mode===0){ spinning=true; fast=false; }        // human reading speed (slow)
    else if(mode===1){ spinning=true; fast=true; }    // AI cache speed (fast)
    else { spinning=false; fast=false; }              // stop (still)
    paintModes();
  }

  function frame(t){
    if(last==null) last = t;
    var dt = (t-last)/1000; last = t;
    if(dt > 0.1) dt = 0.016;                       // clamp big gaps (backgrounded tab)
    if(target!=null){
      // easing to a chosen point — keep theta CONTINUOUS so every point lands still
      var diff = target - theta;
      theta += diff * Math.min(1, dt*6);           // ease toward target
      if(Math.abs(target-theta) < 0.05){ theta = ((target%360)+360)%360; target = null; }
    } else {
      if(spinning){ theta += dt * (fast ? 230 : 9); }  // gentle idle — or fast: the AI reading the whole at cache speed
      theta = ((theta % 360)+360)%360;             // normalize ONLY when not easing to a target
    }
    rotor.style.transform = "rotate("+theta+"deg)";
    // counter-rotate each node so text stays upright; mark the one nearest the top
    var topI = 0, topScore = -2;
    for(var i=0;i<els.length;i++){
      els[i].style.transform = "translate(-50%,-50%) rotate("+(-theta)+"deg)";
      var screenA = (-90 + i*120 + theta) * Math.PI/180;   // node's on-screen angle
      var upness = Math.cos(screenA + Math.PI/2);           // 1 when at top
      if(upness > topScore){ topScore = upness; topI = i; }
    }
    for(var j=0;j<els.length;j++){
      els[j].classList.toggle("top", j===topI && active==null && !fast);
    }
    if(active!=null){
      pointCap.classList.remove("fastcap");
    } else if(mode===1){
      pointCap.textContent = "cache speed — how AI reads it"; pointCap.classList.add("fastcap");
    } else {
      pointCap.textContent = NODES[topI].role + " · the point ↑"; pointCap.classList.remove("fastcap");
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // rotate node i to the top by the shortest path
  function bringToTop(i){
    var want = -(i*120);
    var cur = theta, best = want;
    // choose the co-terminal angle nearest current theta
    while(best - cur > 180) best -= 360;
    while(best - cur < -180) best += 360;
    target = best;
  }

  function select(i){
    active = i; spinning = false; bringToTop(i);
    for(var k=0;k<els.length;k++){
      els[k].classList.toggle("active", k===i);
      els[k].classList.toggle("dim", k!==i);
      els[k].classList.remove("top");
    }
    pointCap.textContent = NODES[i].role + " · selected";
    render(NODES[i]);
  }
  function selectWhole(){
    active = "whole"; spinning = false; target = null;
    for(var k=0;k<els.length;k++){ els[k].classList.remove("active","dim","top"); }
    pointCap.textContent = "the whole";
    render(WHOLE);
  }
  function resume(){
    active = null; setMode(0);
    for(var k=0;k<els.length;k++){ els[k].classList.remove("active","dim"); }
    renderHint();
  }

  function render(n){
    var meta = (n.meta||[]).map(function(r){
      var cls = r[2]==="plain" ? "v plain" : "v";
      return '<div class="row"><span class="k">'+r[0]+'</span><span class="'+cls+'">'+r[1]+'</span></div>';
    }).join("");
    var fileTag = n.ext ? '<div class="file">'+n.ext+'</div>' : '';
    var verb = n.verb ? '<div class="verbline">it '+n.verb+'</div>' : '';
    panel.innerHTML =
      '<div class="swap">'+
        '<div class="kicker">'+n.kicker+'</div>'+
        '<h1>'+n.role+'</h1>'+ fileTag + verb +
        '<div class="body">'+n.body+'</div>'+
        '<div class="meta">'+meta+'</div>'+
        '<div class="foot">Click the center for <b>the whole</b> · anywhere else to resume the spin</div>'+
      '</div>';
  }
  function renderHint(){
    panel.innerHTML =
      '<div class="swap">'+
        '<div class="kicker">The FAF Trinity</div>'+
        '<h1>Context.<br>Memory.<br>Agents.</h1>'+
        '<div class="body">One foundation an AI stands on. <strong>Context</strong> knows the project, '+
        '<strong>Memory</strong> remembers across sessions, <strong>Agents</strong> act on it.<br><br>'+
        'Click any point to open it — or the smiley at the center for the whole.</div>'+
        '<div class="foot"><b>.faf</b> &middot; <b>.fafm</b> &middot; <b>.fafa</b> — the FAF family</div>'+
      '</div>';
  }

  // click empty stage / press keys
  document.getElementById("stageWrap");
  document.querySelector(".stageWrap").addEventListener("click", function(e){
    if(e.target.closest(".node")||e.target.closest(".center")||e.target.closest(".controls")) return;
    resume();
  });
  window.addEventListener("keydown", function(e){
    if(e.key==="1") select(0);
    else if(e.key==="2") select(1);
    else if(e.key==="3") select(2);
    else if(e.key===" "){ e.preventDefault();
      if(active!=null){ resume(); } else { setMode(mode+1); }   // cycle: human → AI cache → stop
      pressKey();
    }
    else if(e.key==="Escape") resume();
  });

  paintModes();
  renderHint();
})();
</script>
</body>
</html>
