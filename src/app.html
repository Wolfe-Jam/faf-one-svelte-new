<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Announce the self-published AI Catalog (Agent-Card/ai-catalog spec) -->
		<link rel="ai-catalog" href="/.well-known/ai-catalog.json" />

		<!-- Theme FOUC fix: set data-theme on <html> before any CSS paints.
		     Matches the localStorage key + value strings used by +layout.svelte.
		     Without this, dark-preferring users see a light flash on first paint
		     while SSR HTML hydrates. -->
		<script>
			(function () {
				try {
					var saved = localStorage.getItem('faf-theme');
					var dark = saved
						? saved === 'dark'
						: window.matchMedia('(prefers-color-scheme: dark)').matches;
					document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
				} catch (e) {
					try {
						if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
							document.documentElement.setAttribute('data-theme', 'dark');
						}
					} catch (_) {}
				}
			})();
		</script>

		<!-- Default <title> + <meta description> live in src/routes/+layout.svelte's
		     <svelte:head> so route-level overrides resolve cleanly (Svelte head-management
		     dedups; page-level wins over layout-level). Putting them HERE in app.html
		     bypasses Svelte's dedup → duplicate <title> tags → browser picks the FIRST
		     (the shell's), which breaks route-specific titles silently. Don't put them back. -->

		<!-- Site-wide metadata only — page-specific og:title/description/image
		     are set by each route's <svelte:head>. Do NOT add og:image here:
		     it would force-pin every blog post to the homepage card. -->
		<meta property="og:site_name" content=".faf Format Authority" />
		<meta property="twitter:site" content="@fafformat" />
		<meta name="linkedin:owner" content="wolfejam" />
		
		<!-- Additional Meta Tags -->
		<meta name="keywords" content="FAF, AI context, AI format, MCP, Model Context Protocol, Anthropic, Claude, AI development, context management, RadioFAF, MCPaaS" />
		<meta name="author" content="Wolfejam" />
		<meta name="robots" content="index, follow" />
		<meta name="theme-color" content="#FF6B35" />
		<link rel="canonical" href="https://faf.one/" />

		<!-- JSON-LD Structured Data -->
		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "SoftwareApplication",
			"name": ".faf",
			"alternateName": "FAF - Foundational AI-context Format",
			"url": "https://faf.one",
			"description": "Official IANA-registered format (application/vnd.faf+yaml) for AI context. Project DNA for ANY AI.",
			"applicationCategory": "DeveloperApplication",
			"operatingSystem": "Cross-platform",
			"offers": {
				"@type": "Offer",
				"price": "0",
				"priceCurrency": "USD"
			},
			"author": {
				"@type": "Person",
				"name": "James Wolfe",
				"alternateName": "wolfejam"
			},
			"aggregateRating": {
				"@type": "AggregateRating",
				"ratingValue": "9.3",
				"bestRating": "10",
				"ratingCount": "3",
				"reviewCount": "3"
			}
		}
		</script>

		<!-- Google tag (gtag.js) -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-0QXRFTYME8"></script>
		<script>
		  window.dataLayer = window.dataLayer || [];
		  function gtag(){dataLayer.push(arguments);}
		  gtag('js', new Date());

		  gtag('config', 'G-0QXRFTYME8');
		</script>

		<!-- Fonts -->
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Roboto+Condensed:wght@300;400;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
		
		<!-- Favicon -->
		<link rel="icon" type="image/png" href="/favicon.png">
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
		<link rel="manifest" href="/site.webmanifest">

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>

		<!-- Floating Foundation Badge (top-right). HOME twin lives in +layout.svelte
		     (it needs route awareness: a filled white "you are home" dot on /). -->
		<a href="https://foundation.faf.one" class="foundation-badge" aria-label="FAF Foundation">
			<svg viewBox="0 0 100 100" fill="none">
				<path d="M30 50 L45 65 L70 35" stroke="white" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
			</svg>
		</a>
	</body>
</html>
