name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  # Daily rebuild so /.well-known/fafa and the A2A card follow their public
  # sources (faf-agent-public) without a push here. Runs before the 06:08 UTC
  # Spec Alarm, which checks the result.
  schedule:
    - cron: '38 5 * * *'
  workflow_dispatch:

# One deploy at a time, in order: a scheduled run must never finish after a
# newer push's deploy and put an older build back live.
concurrency:
  group: deploy-faf-one
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy faf.one
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Theme contrast gate
        run: python3 scripts/theme-contrast-audit.py --ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy .svelte-kit/cloudflare --project-name faf-one
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1bf695f464907ab0615bc69e7b52e2bf
