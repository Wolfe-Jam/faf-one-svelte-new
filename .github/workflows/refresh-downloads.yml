name: Refresh Download Counts

on:
  schedule:
    # Daily at 09:00 UTC (matches end-of-day for US, start-of-day for EU)
    - cron: '0 9 * * *'
  workflow_dispatch:  # Manual trigger button in GH Actions UI

permissions:
  contents: write  # Required to commit + push updated packages.ts
  actions: write   # Required to start the deploy (a GITHUB_TOKEN push starts no workflows)

jobs:
  refresh:
    runs-on: ubuntu-latest
    name: Refresh packages.ts from live registries
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Fetch live counts and update packages.ts
        run: node scripts/refresh-downloads.mjs

      - name: Commit and push if changed
        id: push
        run: |
          if git diff --quiet src/lib/data/packages.ts; then
            echo "No changes — counts unchanged or all APIs flat"
            exit 0
          fi
          git config user.name "faf-download-bot"
          git config user.email "noreply@faf.one"
          git add src/lib/data/packages.ts
          git commit -m "chore: refresh download counts (daily auto-update)"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # The push above is made with GITHUB_TOKEN, and GitHub starts no workflow from
      # such a push, so deploy.yml never saw the new counts until its next daily run:
      # the banner ran a day behind. workflow_dispatch is allowed with GITHUB_TOKEN.
      - name: Deploy the new counts today
        if: steps.push.outputs.pushed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
